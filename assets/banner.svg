<svg width="1200" height="340" viewBox="0 0 1200 340"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07110D"/>
      <stop offset="50%" stop-color="#0A1510"/>
      <stop offset="100%" stop-color="#0D1B15"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F9D68"/>
      <stop offset="50%" stop-color="#52D99A"/>
      <stop offset="100%" stop-color="#1F9D68"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#52D99A" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#52D99A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity="0.018"
            stroke-width="1"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>

  <!-- Glow -->
  <ellipse cx="600"
           cy="170"
           rx="340"
           ry="210"
           fill="url(#glow)"/>

  <!-- Terminal dots -->
  <circle cx="38" cy="31" r="5" fill="#FF5F57"/>
  <circle cx="58" cy="31" r="5" fill="#FEBC2E"/>
  <circle cx="78" cy="31" r="5" fill="#28C840"/>

  <!-- Path -->
  <text x="105"
        y="36"
        fill="#64736C"
        font-family="monospace"
        font-size="13">
    ~/projects/cifra
  </text>

  <!-- Top right -->
  <text x="1155"
        y="36"
        text-anchor="end"
        fill="#46554E"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    01 / FEATURED
  </text>

  <!-- Project number -->
  <text x="245"
        y="142"
        fill="#52D99A"
        fill-opacity="0.55"
        font-family="monospace"
        font-size="12">
    01
  </text>

  <!-- Main title -->
  <text x="600"
        y="150"
        text-anchor="middle"
        fill="#F0F6F3"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="62"
        letter-spacing="18">
    CIFRA
  </text>

  <!-- Accent line -->
  <rect x="430"
        y="170"
        width="340"
        height="1"
        fill="url(#accent)"
        opacity="0.7"/>

  <!-- Subtitle -->
  <text x="600"
        y="203"
        text-anchor="middle"
        fill="#52D99A"
        font-family="monospace"
        font-size="14"
        letter-spacing="6">
    PERSONAL FINANCE
  </text>

  <!-- Keywords -->
  <text x="600"
        y="239"
        text-anchor="middle"
        fill="#6D7E75"
        font-family="monospace"
        font-size="12"
        letter-spacing="3">
    MONEY / GOALS / INSIGHTS / CONTROL
  </text>

  <!-- Mobile tag -->
  <rect x="536"
        y="258"
        width="128"
        height="26"
        rx="13"
        fill="none"
        stroke="#52D99A"
        stroke-opacity="0.32"/>

  <text x="600"
        y="275"
        text-anchor="middle"
        fill="#7C9B8B"
        font-family="monospace"
        font-size="10"
        letter-spacing="1.5">
    MOBILE-FIRST
  </text>

  <!-- Bottom terminal text -->
  <text x="42"
        y="312"
        fill="#819188"
        font-family="monospace"
        font-size="13">
    &gt; finances, without the chaos
  </text>

  <!-- Animated cursor -->
  <rect x="259"
        y="299"
        width="7"
        height="16"
        rx="1"
        fill="#52D99A">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.1s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Version -->
  <text x="1155"
        y="312"
        text-anchor="end"
        fill="#46554E"
        font-family="monospace"
        font-size="11"
        letter-spacing="2">
    v1.0 / 2026
  </text>

  <!-- Decorative crosses -->
  <g stroke="#52D99A" stroke-opacity="0.25">
    <line x1="920" y1="105" x2="936" y2="105"/>
    <line x1="928" y1="97" x2="928" y2="113"/>
  </g>

  <g stroke="#52D99A" stroke-opacity="0.18">
    <line x1="278" y1="227" x2="290" y2="227"/>
    <line x1="284" y1="221" x2="284" y2="233"/>
  </g>

</svg>
